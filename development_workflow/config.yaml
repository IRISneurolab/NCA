project:
  random_seed: 2026
  delimiter: ";"
  id_column: id
  age_column: chron_age
  n_jobs: -1

brain_age:
  sex_column: sex
  sex_positive_values: ["M", "male", "man", "1", 1]
  sex_negative_values: ["F", "female", "woman", "0", 0]
  feature_columns_file: null
  reserved_columns:
    - id
    - participant_id
    - chron_age
    - diagnosis
    - moca
    - fluency
    - education
    - language
    - site
    - cohort
  development_fraction: 0.80
  outer_folds: 5
  inner_folds: 5
  final_bias_folds: 10
  retained_model: ridge
  candidate_models:
    - ridge
    - svr_linear
    - svr_rbf
    - lasso
    - random_forest
    - gradient_boosting
  grids:
    ridge:
      model__alpha: [0.1, 1.0, 10.0]
    svr_linear:
      model__C: [1.0, 10.0, 100.0, 500.0]
      model__epsilon: [0.1, 0.5, 1.0]
    svr_rbf:
      model__C: [10.0, 100.0, 500.0]
      model__epsilon: [0.1, 0.5, 1.0]
      model__gamma: ["scale", 0.001, 0.01, 0.1]
    lasso:
      model__alpha: [0.001, 0.01, 0.1, 1.0]
    random_forest:
      model__n_estimators: [300, 600]
      model__max_depth: [null, 20]
      model__min_samples_leaf: [1, 2, 5]
      model__max_features: ["sqrt", 0.5]
    gradient_boosting:
      model__n_estimators: [100, 300]
      model__learning_rate: [0.01, 0.05, 0.1]
      model__max_depth: [2, 3]
      model__min_samples_leaf: [1, 5]
  final_ridge_alphas: [0.1, 1.0, 10.0]
  final_ridge_cv: 10

cognitive_age:
  fluency_column: fluency
  education_column: education
  sex_column: sex
  language_column: language
  sex_positive_values: ["M", "male", "man", "1", 1]
  sex_negative_values: ["F", "female", "woman", "0", 0]
  french_values: ["french", "français", "francais", "fr", "1", 1]
  non_french_values: ["english", "anglais", "en", "0", 0]
  boxcox_shift: 1.0
  boxcox_lambda: 0.633
  outer_folds: 5
  inner_folds: 5
  final_bias_folds: 10
  retained_model: svr_linear
  candidate_models:
    - ridge
    - svr_linear
    - svr_rbf
    - lasso
    - random_forest
    - gradient_boosting
  grids:
    ridge:
      model__alpha: [0.1, 1.0, 10.0]
    svr_linear:
      model__C: [1.0, 10.0, 100.0, 500.0]
      model__epsilon: [0.1, 0.5, 1.0]
    svr_rbf:
      model__C: [10.0, 100.0, 500.0]
      model__epsilon: [0.1, 0.5, 1.0]
      model__gamma: ["scale", 0.001, 0.01, 0.1]
    lasso:
      model__alpha: [0.001, 0.01, 0.1, 1.0]
    random_forest:
      model__n_estimators: [300, 600]
      model__max_depth: [null, 20]
      model__min_samples_leaf: [1, 2, 5]
      model__max_features: ["sqrt", 0.5]
    gradient_boosting:
      model__n_estimators: [100, 300]
      model__learning_rate: [0.01, 0.05, 0.1]
      model__max_depth: [2, 3]
      model__min_samples_leaf: [1, 5]
  final_svr:
    C: 500.0
    epsilon: 0.5
    tolerance: 0.001

fusion:
  brain_age_column: brain_age
  cognitive_age_column: cognitive_age
  moca_column: moca
  diagnosis_column: diagnosis
  control_labels: ["CON", "CN", "CU", "control", "unimpaired", "0", 0]
  impaired_labels: ["MCI", "AD", "impaired", "1", 1]
  outer_folds: 10
  inner_folds: 10
  retained_strategy: weighted_mean
  strategies:
    - simple_mean
    - weighted_mean
    - euclidean
    - exponential
    - logarithmic
    - linear_regression
    - penalized_splines
  spline_knots: 5
  spline_degree: 3
  spline_ridge_alphas: [0.1, 1.0, 10.0, 100.0]
  weight_bootstrap_iterations: 1000
  diagnostic_score: age

evaluation:
  bootstrap_iterations: 1000
  confidence_level: 0.95
  subgroup_columns: [sex]
  age_groups:
    - {label: "40-59", lower: 40, upper: 60}
    - {label: "60-75", lower: 60, upper: 76}
    - {label: ">75", lower: 76, upper: null}
  education_groups:
    - {label: "Low", lower: 6, upper: 13}
    - {label: "Medium", lower: 13, upper: 17}
    - {label: "High", lower: 17, upper: null}

